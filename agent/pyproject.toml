[project]
name = "grant-writer-agent"
version = "0.1.0"
description = "Autonomous AI agent that writes complete grant applications"
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk>=0.1.0",
    "anthropic>=0.40.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
]

[project.scripts]
grant-agent = "grant_writer_agent.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
